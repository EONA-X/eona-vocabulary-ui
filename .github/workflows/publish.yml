name: Publish to GitHub Pages

# Build the standalone Trunk/WASM bundle (see build.sh) and deploy it to
# GitHub Pages. Uses the bundled sample-data/docs fixture as the /docs tree —
# swap in a `workflow_dispatch` input or a repository_dispatch trigger from a
# real data source once one exists (see build.sh's usage comment).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege + the tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1
  # Pinned to match Cargo.lock / Trunk.toml — see Dockerfile for why.
  TRUNK_VERSION: 0.22.0-beta.2
  WASM_BINDGEN_VERSION: 0.2.127

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # crates/eona-crosswalk-transform (see .gitmodules) is public on GitHub,
      # so plain submodule checkout needs no credentials.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: cargo install trunk@${{ env.TRUNK_VERSION }} --locked

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }} --locked

      # Resolves the actual path this deploy will be served under (e.g.
      # "/eona-vocabulary-ui/" for a project site, "/" behind a custom
      # domain) — build.sh's second argument, so every internal link and
      # /docs fetch (see index.html's <base data-trunk-public-url>) still
      # resolves correctly however Pages is configured for this repo.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: ./build.sh sample-data/docs "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
