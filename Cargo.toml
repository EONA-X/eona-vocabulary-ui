[package]
name = "eovoc-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.104"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.104", features = ["Navigator", "Clipboard", "Window", "HtmlSelectElement", "Document", "Element", "Location", "EventTarget", "HtmlInputElement", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "History", "UrlSearchParams", "KeyboardEvent"] }
yew = { version = "0.23.0", features = ["csr"] }
