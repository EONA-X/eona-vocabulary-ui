<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Owl illustration">
  <title>EONA-X Vocabulary Hub — default ontology illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1228" />
      <stop offset="100%" stop-color="#142a52" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b6cb0" />
      <stop offset="100%" stop-color="#12213f" />
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#eaf4ff" />
      <stop offset="100%" stop-color="#90e0ef" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)" />

  <!-- soft branch line -->
  <path d="M0 230 C 120 210, 280 250, 400 220" stroke="#1d3a66" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- ear tufts -->
  <path d="M148 92 L128 44 L172 78 Z" fill="#4da6ff" />
  <path d="M252 92 L272 44 L228 78 Z" fill="#4da6ff" />

  <!-- body -->
  <ellipse cx="200" cy="185" rx="92" ry="88" fill="url(#body)" />

  <!-- wings -->
  <path d="M112 150 C 82 190, 86 240, 118 262 C 108 220, 112 182, 132 156 Z" fill="#0f1e3a" opacity="0.85" />
  <path d="M288 150 C 318 190, 314 240, 282 262 C 292 220, 288 182, 268 156 Z" fill="#0f1e3a" opacity="0.85" />

  <!-- face disc -->
  <circle cx="200" cy="168" r="72" fill="#12213f" />

  <!-- eyes -->
  <circle cx="168" cy="164" r="30" fill="url(#eye)" />
  <circle cx="232" cy="164" r="30" fill="url(#eye)" />
  <circle cx="168" cy="166" r="11" fill="#0b1228" />
  <circle cx="232" cy="166" r="11" fill="#0b1228" />
  <circle cx="172" cy="161" r="3" fill="#ffffff" />
  <circle cx="236" cy="161" r="3" fill="#ffffff" />

  <!-- beak -->
  <path d="M200 186 L188 206 L212 206 Z" fill="#f6b93b" />

  <!-- belly chevrons -->
  <g stroke="#4da6ff" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M172 232 L200 220 L228 232" />
    <path d="M178 250 L200 240 L222 250" />
  </g>

  <!-- feet -->
  <path d="M180 258 L172 272 M180 258 L182 274 M180 258 L190 270" stroke="#f6b93b" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M220 258 L212 270 M220 258 L220 274 M220 258 L228 272" stroke="#f6b93b" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
